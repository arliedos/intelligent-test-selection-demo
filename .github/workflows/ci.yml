name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install editable package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest with junit + coverage reports
        run: >
          python -m pytest
          --junitxml=reports/junit.xml
          --cov=demoshop
          --cov-report=xml:reports/coverage.xml
          --cov-report=term

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
          if-no-files-found: warn
