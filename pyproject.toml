[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demoshop"
version = "0.1.0"
description = "Synthetic demo shop application used to evaluate a read-only regression-suite-selection agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary-Demo" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/demoshop"]
branch = true
